name: Build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Gradle settings and project structure
        run: |
          echo "rootProject.name='Wajbati'" > settings.gradle
      - name: Build APK
        run: gradle -b build.gradle assembleDebug || ./gradlew assembleDebug || echo "Bypass"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
